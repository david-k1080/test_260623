server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript text/plain application/json image/svg+xml;
  gzip_min_length 1024;

  # 보안 헤더 — 외부 스크립트를 쓰지 않으므로 self 만 허용
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # 검색엔진 색인 방지(공유 링크로만 열람). 공개 노출이 필요하면 이 줄을 지우세요.
  add_header X-Robots-Tag "noindex, nofollow" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
  # data.js 는 자주 바뀌므로 매번 재검증, 라이브러리는 길게 캐시
  location = /assets/data.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }
  location /assets/vendor/ { add_header Cache-Control "public, max-age=2592000, immutable" always; add_header X-Content-Type-Options "nosniff" always; }
  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
}
