<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미팅 통역</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--tx:#e8ebf1;--mut:#8b93a5;--ko:#7cc4ff;--en:#ffcf7a;--acc:#3b82f6;--bad:#ef4444;--fs:34px}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f8;--panel:#fff;--line:#dde1ea;--tx:#161922;--mut:#667085;--ko:#0b62b8;--en:#a45a00}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
header h1{font-size:15px;margin:0;font-weight:700;flex:none}
#state{font-size:12px;color:var(--mut);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#state.err{color:var(--bad)}
button{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
#go{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;padding:10px 20px;font-size:16px}
#go.on{background:var(--bad);border-color:var(--bad)}
#go:disabled{opacity:.5;cursor:wait}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
main.stack{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
@media (orientation:portrait){main.auto{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.lane{background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0}
.lane h2{margin:0;padding:8px 14px;font-size:13px;font-weight:600;color:var(--mut);border-bottom:1px solid var(--line);flex:none;display:flex;justify-content:space-between}
.lane.ko h2 b{color:var(--ko)} .lane.en h2 b{color:var(--en)}
.feed{flex:1;overflow-y:auto;padding:12px 16px 20px;scroll-behavior:smooth}
.empty{color:var(--mut);font-size:14px;padding:30px 6px;text-align:center;line-height:1.6}
.it{margin:0 0 18px}
.it .big{font-size:var(--fs);line-height:1.28;font-weight:600;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
.lane.ko .big{color:var(--ko)} .lane.en .big{color:var(--en)}
.it .src{font-size:calc(var(--fs)*.45);color:var(--mut);margin-top:4px;line-height:1.35}
.it.draft .big{opacity:.55}
.it.fail .big{color:var(--bad);font-size:calc(var(--fs)*.55)}
.it .meta{font-size:11px;color:var(--mut);margin-top:3px}
#interim{flex:none;min-height:24px;padding:4px 14px;font-size:13px;color:var(--mut);border-top:1px solid var(--line);background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.on{opacity:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 10px}
.seg button.sel{background:var(--acc);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
#drawer{position:fixed;inset:0 0 0 auto;width:min(360px,100vw);background:var(--panel);border-left:1px solid var(--line);padding:16px;transform:translateX(100%);transition:transform .18s;z-index:20;overflow-y:auto}
#drawer.on{transform:none}
#drawer h3{margin:0 0 12px;font-size:16px}
#drawer .row{margin:14px 0}
#drawer label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
#drawer input[type=text]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
#drawer small{color:var(--mut);display:block;margin-top:6px;line-height:1.5}
#ov{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;flex-direction:column}
#ov.on{display:flex}
#ov .bar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
#ov .bar b{flex:1}
#ovtext{flex:1;overflow:auto;padding:16px;white-space:pre-wrap;line-height:1.65;font-size:15px;max-width:820px;width:100%;margin:0 auto}
</style>
</head>
<body>
<header>
  <h1>미팅 통역</h1>
  <span id="state">연결 중…</span>
  <button id="go" disabled>미팅 시작</button>
  <button id="gear" title="설정">⚙</button>
</header>

<main id="main" class="auto">
  <section class="lane ko">
    <h2><b>한국어로 말한 것</b><span>→ English</span></h2>
    <div class="feed" id="feedKo"><div class="empty">한국어로 말하면<br>영어가 크게 여기에 나옵니다</div></div>
  </section>
  <section class="lane en">
    <h2><b>English spoken</b><span>→ 한국어</span></h2>
    <div class="feed" id="feedEn"><div class="empty">상대가 영어로 말하면<br>한국어가 크게 여기에 나옵니다</div></div>
  </section>
</main>
<div id="interim"></div>
<div id="toast"></div>

<aside id="drawer">
  <h3>설정</h3>
  <div class="row"><label>인식 언어 (미팅 시작 전에 바꾸면 반영)</label>
    <div class="seg" id="recSeg"><button data-v="auto">자동</button><button data-v="ko">한국어</button><button data-v="en">English</button></div>
    <small id="recHelp"></small></div>
  <div class="row"><label>화면 배치</label>
    <div class="seg" id="layoutSeg"><button data-v="auto">자동</button><button data-v="side">좌우</button><button data-v="stack">위아래</button></div></div>
  <div class="row"><label>글자 크기</label>
    <button id="fMinus">A−</button> <button id="fPlus">A+</button></div>
  <div class="row"><label>내 이름 (회의록에 표시)</label><input type="text" id="name" maxlength="30"></div>
  <div class="row"><button id="btnMin">💾 회의록 받기</button> <button id="btnSum">📝 요약 만들기</button></div>
  <div class="row"><button id="btnClear">화면 지우기</button> <small>저장된 회의록은 그대로 남습니다.</small></div>
  <div class="row"><small id="info"></small></div>
  <div class="row"><button id="close">닫기</button></div>
</aside>

<div id="ov"><div class="bar"><b id="ovtitle"></b><button id="ovsave">저장</button><button id="ovx">닫기</button></div><div id="ovtext"></div></div>

<script>
const $ = id => document.getElementById(id);
const LS = { get(k, d) { try { const v = localStorage.getItem('mi.' + k); return v == null ? d : v; } catch { return d; } }, set(k, v) { try { localStorage.setItem('mi.' + k, v); } catch {} } };
const isLoopback = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
let ws, sttMode = 'browser', rec = LS.get('rec', 'auto'), serverRec = null, running = false, wantRun = false, joined = false;
let audio = null, pre = null, bsr = null, reconnectDelay = 500, glossN = 0;
const items = new Map();                                             // id → {el, lane}
let layout = LS.get('layout', 'auto'), fs = +LS.get('fs', 34);
let startedOnce = false;

function toast(t, ms = 2600) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), ms); }
function state(t, err) { $('state').textContent = t; $('state').classList.toggle('err', !!err); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---- 화면 ----
function applyLayout() { const m = $('main'); m.className = layout === 'side' ? '' : layout === 'stack' ? 'stack' : 'auto'; document.querySelectorAll('#layoutSeg button').forEach(b => b.classList.toggle('sel', b.dataset.v === layout)); }
function applyFs() { fs = Math.max(18, Math.min(72, fs)); document.documentElement.style.setProperty('--fs', fs + 'px'); LS.set('fs', fs); }
function laneOf(lang) { return lang === 'ko' ? $('feedKo') : $('feedEn'); }     // 한국어 발언 → 왼쪽, 영어 발언 → 오른쪽
function render(el, o) {
  const big = o.tr ? esc(o.tr) : (o.draft ? '…' : '(번역 실패 — 원문 확인)');
  el.className = 'it' + (o.draft ? ' draft' : '') + (!o.tr && !o.draft ? ' fail' : '');
  el.innerHTML = `<div class="big">${big}</div><div class="src">${esc(o.text)}</div>` + (o.name && !o.draft ? `<div class="meta">${esc(o.name)} · ${new Date(o.t || Date.now()).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}</div>` : '');
}
function put(id, lang, o) {
  let it = items.get(id);
  if (it && it.lane !== lang) { it.el.remove(); items.delete(id); it = null; }       // 확정 때 언어가 바뀐 경우 반대편으로 이동
  const feed = laneOf(lang);
  feed.querySelectorAll('.empty').forEach(e => e.remove());
  if (!it) { it = { el: document.createElement('div'), lane: lang }; items.set(id, it); feed.append(it.el); }
  render(it.el, o);
  const near = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 240;
  if (near || !o.draft) feed.scrollTop = feed.scrollHeight;
}
function drop(id) { const it = items.get(id); if (it) { it.el.remove(); items.delete(id); } }
function clearScreen() { items.clear(); $('feedKo').innerHTML = '<div class="empty">한국어로 말하면<br>영어가 크게 여기에 나옵니다</div>'; $('feedEn').innerHTML = '<div class="empty">상대가 영어로 말하면<br>한국어가 크게 여기에 나옵니다</div>'; }

// ---- 연결 ----
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    reconnectDelay = 500;
    ws.send(JSON.stringify({ type: 'join', room: 'LOCAL', name: $('name').value.trim() || '나', lang: 'ko', mode: 'meeting', rec }));
  };
  ws.onmessage = ev => {
    if (typeof ev.data !== 'string') return;
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'joined') {
      joined = true; sttMode = m.stt; serverRec = m.rec; glossN = m.glossary || 0;
      if (m.stt === 'browser' && rec === 'auto') { rec = 'ko'; }
      updateSettingsUI();
      $('go').disabled = false;
      state(running ? '듣는 중…' : '준비됨 — “미팅 시작”을 누르세요');
      if (wantRun && !running) startMeeting(true);                     // 끊겼다 다시 연결되면 자동 이어서
    } else if (m.type === 'history') {
      m.items.forEach(x => put(x.id, x.lang, x));
    } else if (m.type === 'sentence') put(m.id, m.lang, { text: m.text, tr: m.tr, name: m.name, t: m.t });
    else if (m.type === 'draft2') { const it = items.get(m.id); if (!it || it.el.classList.contains('draft')) put(m.id, m.lang, { text: m.text, tr: m.tr, draft: true }); }
    else if (m.type === 'sentence_drop') drop(m.id);
    else if (m.type === 'interim') $('interim').textContent = m.text ? '… ' + m.text : '';
    else if (m.type === 'stt_error') { toast(m.message || '음성 인식 오류'); state(m.message || '음성 인식 오류', true); }
    else if (m.type === 'rate_limited') toast('너무 빠르게 말해 일부 문장을 건너뛰었습니다');
    else if (m.type === 'denied') state('접속이 거부되었습니다', true);
    else if (m.type === 'minutes') { openOv('회의록', m.text, m.filename); }
    else if (m.type === 'summary') {
      if (m.error) { toast(m.error === 'empty' ? '아직 요약할 대화가 없습니다' : m.error === 'busy' ? '잠시 후 다시 눌러 주세요 (30초에 한 번)' : '요약에 실패했습니다'); }
      else openOv('회의 요약', m.text, m.filename);
    }
  };
  ws.onclose = () => {
    joined = false; $('go').disabled = true; $('interim').textContent = '';
    if (audio) pauseCapture();                                           // 마이크는 잠시 끄고, 다시 연결되면 이어서 시작
    state('연결이 끊겼습니다. 다시 연결 중…', true);
    setTimeout(connect, reconnectDelay); reconnectDelay = Math.min(5000, reconnectDelay * 2);
  };
  ws.onerror = () => {};
}

// ---- 마이크: Deepgram 경로 (PCM → 서버) ----
const WORKLET = `
class P extends AudioWorkletProcessor {
  constructor(){ super(); this.r = sampleRate / 16000; this.ph = 0; this.acc = 0; this.n = 0; this.out = new Int16Array(1600); this.o = 0; }
  process(inputs){
    const ch = inputs[0][0]; if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.acc += ch[i]; this.n++; this.ph += 1;
      if (this.ph >= this.r) {
        this.ph -= this.r; const v = Math.max(-1, Math.min(1, this.acc / this.n)); this.acc = 0; this.n = 0;
        this.out[this.o++] = v < 0 ? v * 32768 : v * 32767;
        if (this.o === 1600) { this.port.postMessage(this.out.slice().buffer); this.o = 0; }
      }
    }
    return true;
  }
}
registerProcessor('p', P);`;
async function startAudio() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })));
  const src = ctx.createMediaStreamSource(stream), node = new AudioWorkletNode(ctx, 'p');
  node.port.onmessage = e => { if (ws.readyState === 1) ws.send(e.data); };
  const mute = ctx.createGain(); mute.gain.value = 0; src.connect(node); node.connect(mute); mute.connect(ctx.destination);
  audio = { stream, ctx, node };
  ws.send(JSON.stringify({ type: 'mic_start' }));
}
function stopAudio() {
  if (!audio) return;
  try { ws.readyState === 1 && ws.send(JSON.stringify({ type: 'mic_stop' })); } catch {}
  try { audio.node.disconnect(); audio.stream.getTracks().forEach(t => t.stop()); audio.ctx.close(); } catch {}
  audio = null;
}
function pauseCapture() { stopAudio(); stopBrowser(); running = false; refreshGo(); }

// ---- 마이크: 브라우저 내장 인식 (Deepgram 키가 없을 때, Chrome/Edge) ----
function startBrowser() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge를 사용하세요.', 5000); return false; }
  bsr = new SR(); bsr.continuous = true; bsr.interimResults = true; bsr.lang = rec === 'en' ? 'en-US' : 'ko-KR';
  bsr.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) { const t = r[0].transcript.trim(); if (t && ws.readyState === 1) ws.send(JSON.stringify({ type: 'utterance', text: t })); }
      else interim += r[0].transcript;
    }
    if (interim && ws.readyState === 1) ws.send(JSON.stringify({ type: 'partial', text: interim }));
  };
  bsr.onend = () => { if (running && bsr) try { bsr.start(); } catch {} };
  bsr.onerror = e => { if (e.error === 'not-allowed') { toast('마이크 권한을 허용해 주세요', 5000); wantRun = false; running = false; refreshGo(); } };
  try { bsr.start(); } catch { return false; }
  return true;
}
function stopBrowser() { if (bsr) { const b = bsr; bsr = null; try { b.onend = null; b.stop(); } catch {} } }

// ---- 시작/종료 ----
function refreshGo() { const b = $('go'); b.textContent = running ? '미팅 종료' : '미팅 시작'; b.classList.toggle('on', running); }
async function startMeeting(auto) {
  if (running || !joined) return;
  $('go').disabled = true;
  try {
    if (sttMode === 'deepgram') await startAudio(); else if (!startBrowser()) throw new Error('browser-stt');
    running = true; wantRun = true;
    state(sttMode === 'deepgram' ? (rec === 'auto' ? '듣는 중 (한국어·영어 자동 구분)' : '듣는 중 (' + (rec === 'ko' ? '한국어' : 'English') + ')') : '듣는 중 (브라우저 인식 · ' + (rec === 'ko' ? '한국어' : 'English') + ')');
    startedOnce = true;
  } catch (e) {
    running = false; wantRun = false; stopAudio(); stopBrowser();
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    state(denied ? '마이크 권한이 필요합니다' : '마이크를 켤 수 없습니다', true);
    toast(denied ? '주소창 왼쪽 자물쇠 → 마이크 허용 후 다시 누르세요' : '마이크를 켤 수 없습니다: ' + (e && e.message || e), 5000);
  }
  $('go').disabled = !joined; refreshGo();
}
function stopMeeting() { wantRun = false; running = false; stopAudio(); stopBrowser(); $('interim').textContent = ''; state('중지됨 — 회의록은 자동 저장됩니다'); refreshGo(); }
$('go').onclick = () => running ? stopMeeting() : startMeeting();

// ---- 설정 ----
function updateSettingsUI() {
  document.querySelectorAll('#recSeg button').forEach(b => { b.classList.toggle('sel', b.dataset.v === rec); b.disabled = b.dataset.v === 'auto' && sttMode !== 'deepgram'; });
  $('recHelp').textContent = sttMode === 'deepgram'
    ? '자동: 한국어·영어를 한 번에 듣고 실제로 말한 언어를 AI가 판별합니다.'
    : 'Deepgram 키가 없어 브라우저 내장 인식을 쓰는 중입니다. 한 번에 한 언어만 듣습니다 (상대 영어 차례에는 English로 바꾸세요). 정확도와 자동 구분을 원하면 interpreter.env 에 DEEPGRAM_API_KEY 를 넣으세요.';
  $('info').textContent = `용어집 ${glossN}개 적용 중 · 이 컴퓨터에서만 접속됩니다`;
}
document.querySelectorAll('#recSeg button').forEach(b => b.onclick = () => {
  if (b.disabled) return; rec = b.dataset.v; LS.set('rec', rec); updateSettingsUI();
  const was = running; if (was) { stopAudio(); stopBrowser(); running = false; }
  if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'set_rec', rec }));
  if (was) setTimeout(() => startMeeting(), 300);
});
document.querySelectorAll('#layoutSeg button').forEach(b => b.onclick = () => { layout = b.dataset.v; LS.set('layout', layout); applyLayout(); });
$('fPlus').onclick = () => { fs += 4; applyFs(); }; $('fMinus').onclick = () => { fs -= 4; applyFs(); };
$('gear').onclick = () => $('drawer').classList.toggle('on'); $('close').onclick = () => $('drawer').classList.remove('on');
$('name').value = LS.get('name', '나'); $('name').onchange = () => LS.set('name', $('name').value.trim() || '나');
$('btnClear').onclick = clearScreen;
$('btnMin').onclick = () => ws.readyState === 1 && ws.send(JSON.stringify({ type: 'get_minutes' }));
$('btnSum').onclick = () => { if (ws.readyState !== 1) return; toast('요약을 만드는 중… (몇 초)', 4000); ws.send(JSON.stringify({ type: 'summarize' })); };
let ovFile = 'minutes.md';
function openOv(title, text, filename) { $('ovtitle').textContent = title; $('ovtext').textContent = text; ovFile = filename || 'minutes.md'; $('ov').classList.add('on'); }
$('ovx').onclick = () => $('ov').classList.remove('on');
$('ovsave').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([$('ovtext').textContent], { type: 'text/markdown;charset=utf-8' })); a.download = ovFile; document.body.append(a); a.click(); a.remove(); };

applyLayout(); applyFs();
if (!isLoopback && location.protocol !== 'https:') state('https 또는 localhost 에서만 마이크를 쓸 수 있습니다', true);
connect();
</script>
</body>
</html>
